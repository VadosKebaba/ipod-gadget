# ipod-gadget extras/pi-audio (installed as /etc/pipewire/pipewire.conf.d/50-aucd-ipod.conf)
#
# The car takes 44.1 kHz and nothing else, so the whole graph runs at 44.1 kHz: everything
# else (the phone over Bluetooth, the browser, AUCD's own sounds) is resampled once, on its
# way in, and the iPod output never has to change rate.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]

    # one graph cycle = 512 samples (11.6 ms), always: the phone's Bluetooth stream asks
    # for 512 anyway, so the cycle no longer changes (from PipeWire's 1024 when idle, or up
    # to 2048 for a player on the Pi) when the phone starts or stops playing.
    # Back to PipeWire's defaults: delete these three lines (README, "Latency").
    default.clock.quantum       = 512
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 512
}
