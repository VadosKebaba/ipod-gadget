# ipod-gadget extras/pi-audio (installed as /etc/wireplumber/wireplumber.conf.d/50-aucd-ipod.conf)
#
# The iPod USB output (g_ipod_audio's card "iPod USB") is the Pi's default speaker and is
# always on.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-snd_usb_ipod*" }
    ]
    actions = {
      update-props = {
        device.description = "Car (iPod USB)"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-snd_usb_ipod.*" }
    ]
    actions = {
      update-props = {
        node.description = "Car (iPod USB)"
        node.nick        = "Car"

        # the default speaker, above anything else (q60-pi-dash's USB DAC rule uses 2000)
        priority.session = 3000

        # the car's USB clock drives the graph: the phone's Bluetooth stream (2010) and
        # everything else follow it and are resampled to match, so nothing drifts
        priority.driver  = 3000

        # never suspended, never paused: with nothing playing, silence keeps flowing, so
        # the car never sees the stream stop and there is no click when audio starts
        session.suspend-timeout-seconds = 0
        node.pause-on-idle              = false
        node.always-process             = true

        # 11.6 ms more in the buffer: room for a late graph cycle on a busy Pi (the browser,
        # the dash) before it is an audible gap. It was 1024 (23 ms) after xruns in a QEMU
        # VM, far slower than a Pi 5; PipeWire's own default here is 0. Back to the old
        # value: 1024 (README, "Latency")
        api.alsa.headroom = 512

        # what the Pi's buffers don't show, for the delay the Pi reports to the phone over
        # Bluetooth (the phone delays its video by that, for lip sync): g_ipod_audio's 4
        # queued USB requests of 1 ms each. The head unit's own delay is not in it
        # (unknown): add it here once measured (README, "Lip sync")
        latency.internal.ns = 4000000

        # the only format the car takes
        audio.format        = "S16LE"
        audio.rate          = 44100
        audio.channels      = 2
        audio.position      = [ FL FR ]
        audio.allowed-rates = [ 44100 ]
      }
    }
  }
]
