# ipod-gadget extras/pi-audio (installed as /etc/wireplumber/wireplumber.conf.d/51-aucd-bluetooth.conf)
#
# The Pi is a Bluetooth speaker (A2DP sink) for the phone, with nobody logged in.

wireplumber.profiles = {
  main = {
    # WirePlumber normally runs Bluetooth only while its user is logged in on a seat; the
    # Pi in the car has no login at all, so without this the phone never finds a speaker
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  # a speaker and nothing else: no hands-free (there is no microphone, and the phone would
  # send calls to the Pi instead of the car's own Bluetooth), no LE Audio
  bluez5.roles          = [ a2dp_sink ]
  bluez5.hfphsp-backend = "none"

  # AAC when this PipeWire is built with it (Debian's and so far Raspberry Pi OS's are not),
  # otherwise SBC; an iPhone offers only those two
  bluez5.codecs = [ aac sbc_xq sbc ]
}

monitor.bluez.rules = [
  {
    # the phone's audio is a playback stream, so it goes to the default speaker: the car
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = {
      update-props = {
        bluez5.media-source-role = "playback"
      }
    }
  }
]
