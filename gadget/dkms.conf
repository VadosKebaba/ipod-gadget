# DKMS rebuilds the modules whenever a new kernel and its headers get installed
# (on Raspberry Pi OS that is any `apt full-upgrade` that brings a new kernel).
# install-rpi.sh registers this directory as /usr/src/ipod-gadget-<PACKAGE_VERSION>.
PACKAGE_NAME="ipod-gadget"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="g_ipod_audio"
BUILT_MODULE_NAME[1]="g_ipod_hid"
BUILT_MODULE_NAME[2]="g_ipod_gadget"
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
DEST_MODULE_LOCATION[2]="/updates/dkms"
AUTOINSTALL="yes"
